{id:"riemann",n:1,name:"The Riemann Hypothesis",tag:"Where do the prime numbers hide?",st:["Active","active"],core:"Grade 3 core: multiplication facts and skip counting.",

,{id:"gr",n:8,bonus:true,name:"Bonus: Gravity as Curved Space",tag:"Heavy things bend space",st:["Not a Clay problem","bonus"],core:"Grade 4 core: lines, parallel lines and angles.",

function isPrime(n){if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true}
function divs(n){var d=[];for(var i=1;i<=n;i++)if(n%i===0)d.push(i);return d}

function riemannPlay(el){
 el.innerHTML="<b>The strike-out game.</b> Board size: <span id='rsz'>60</span><input type='range' id='rn' min='30' max='100' value='60'><div class='grid' id='rg'></div><div><button data-p='2'>Strike out 2s</button> <button data-p='3'>3s</button> <button data-p='5'>5s</button> <button data-p='7'>7s</button> <button id='rrs'>Reset</button></div><p id='rinfo' class='big'>Strike out the multiples. What is left?</p><details><summary>Extra for older kids: Euler's add-up (s = 2)</summary><label>How many fractions: <span id='rk'>5</span></label><input type='range' id='rs' min='1' max='200' value='5'><p id='rsum'></p></details>";
 var out={},N=60;
 function draw(){N=+$("rn").value;$("rsz").textContent=N;var g=$("rg");g.innerHTML="";
  for(var n=1;n<=N;n++){var b=document.createElement("button");b.textContent=n;if(out[n])b.style.opacity=".2";else if(n>1&&isPrime(n)&&Object.keys(out).length>0)b.className="pr";g.appendChild(b)}
  var left=[];for(n=2;n<=N;n++)if(!out[n])left.push(n);
  $("rinfo").textContent=Object.keys(out).length?"Left standing: "+left.join(", "):"Strike out the multiples. What is left?"}
 Array.prototype.forEach.call(el.querySelectorAll("button[data-p]"),function(b){b.onclick=function(){var p=+b.getAttribute("data-p");for(var m=p*2;m<=100;m+=p)out[m]=true;draw()}});
 $("rrs").onclick=function(){out={};draw()};$("rn").oninput=draw;draw();
 function sum(){var K=+$("rs").value,t=0;for(var k=1;k<=K;k++)t+=1/(k*k);$("rk").textContent=K;$("rsum").innerHTML="1 + 1/4 + 1/9 + ... ("+K+" fractions) = <b>"+t.toFixed(5)+"</b><br><span class='small'>It never passes π²/6 = "+(Math.PI*Math.PI/6).toFixed(5)+" (Euler, 1735).</span>"}
 $("rs").oninput=sum;sum()}

function pnpPlay(el){
 el.innerHTML="<b>Find numbers that add to the target.</b> Tap numbers to pick them. Checking is instant. Finding takes work.<p>Target: <span class='big' id='ptar'></span></p><div class='nums' id='pn'></div><p>Your total: <span class='big' id='psum'></span> <span id='pok'></span></p><button id='pnew'>New puzzle</button> <button id='psolve' class='btn'>Let the computer try every combination</button><p id='pout' class='small'></p><p class='small'>12 numbers have 4,096 possible groups to try. 40 numbers would have 1,099,511,627,776 groups. Checking one group is always a single addition.</p>";
 var nums,sel,tar;
 function newP(){nums=[];for(var i=0;i<12;i++)nums.push(3+Math.floor(Math.random()*47));
  var s=0;nums.forEach(function(x){if(Math.random()<.45)s+=x});if(s===0)s=nums[0];tar=s;sel={};draw();$("pout").textContent=""}
 function draw(){var b=$("pn");b.innerHTML="";nums.forEach(function(x,i){var e=document.createElement("button");e.textContent=x;if(sel[i])e.className="on";e.onclick=function(){sel[i]=!sel[i];draw()};b.appendChild(e)});
  var t=0;nums.forEach(function(x,i){if(sel[i])t+=x});$("ptar").textContent=tar;$("psum").textContent=t;$("pok").textContent=t===tar?"Match!":(t>tar?"Too big":"Too small")}
 $("pnew").onclick=newP;
 $("psolve").onclick=function(){var tries=0,found=null,N=nums.length;
  for(var m=1;m<(1<<N);m++){tries++;var t=0;for(var i=0;i<N;i++)if(m&(1<<i))t+=nums[i];if(t===tar){found=m;break}}
  sel={};if(found!==null){for(var i=0;i<N;i++)if(found&(1<<i))sel[i]=true}draw();
  $("pout").textContent="The computer tried "+tries+" groups out of 4,095 before it found one. Checking that answer took one addition."}
 newP()}

function nsPlay(el){
 el.innerHTML="<b>A picture of swirling water</b> (a drawing of the idea, not a solution of the equations).<canvas id='nc' width='520' height='240' style='width:100%;background:#0b1730;border-radius:10px'></canvas><label>Speed of swirl: <span id='nsv'>5</span></label><input type='range' id='ns1' min='1' max='10' value='5'><label>Thickness (viscosity): <span id='nvv'>3</span></label><input type='range' id='ns2' min='0' max='10' value='3'><p class='small'>Thick fluids (high ν) swirl like honey: the middle moves, and the swirl fades with distance fast. Thin fluids (low ν) keep swirling far out.</p>";
 var c=$("nc"),x=c.getContext("2d"),P=[],i;
 for(i=0;i<420;i++)P.push([Math.random()*520,Math.random()*240]);
 function step(){if(!document.body.contains(c))return;
  var s=+$("ns1").value,v=+$("ns2").value;$("nsv").textContent=s;$("nvv").textContent=v;
  x.fillStyle="rgba(11,23,48,.14)";x.fillRect(0,0,520,240);x.fillStyle="#9fd3ff";
  for(var k=0;k<P.length;k++){var p=P[k],dx=p[0]-260,dy=p[1]-120,r=Math.sqrt(dx*dx+dy*dy)+1;
   var w=s*.0035/(1+v*r*r/9000)*(40/Math.sqrt(r+20));var a=w*r;
   p[0]+=-dy/r*a*40+.4;p[1]+=dx/r*a*40;
   if(p[0]>520||p[0]<0||p[1]<0||p[1]>240){p[0]=Math.random()*520;p[1]=Math.random()*240}
   x.fillRect(p[0],p[1],1.8,1.8)}
  requestAnimationFrame(step)}
 step()}

function bsdPlay(el){
 el.innerHTML="<b>Make a curve.</b> y² = x³ + ax + b<br><label>a: <span id='bav'>-1</span></label><input type='range' id='ba' min='-6' max='6' value='-1'><label>b: <span id='bbv'>1</span></label><input type='range' id='bb' min='-6' max='6' value='1'><canvas id='bc' width='520' height='260' style='width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px'></canvas><p id='bmsg'></p><p id='bnp' class='small'></p>";
 var c=$("bc"),x=c.getContext("2d");
 function draw(){var a=+$("ba").value,b=+$("bb").value;$("bav").textContent=a;$("bbv").textContent=b;
  var cs=getComputedStyle(document.documentElement);var ink=cs.getPropertyValue("--ink"),mu=cs.getPropertyValue("--line"),ac=cs.getPropertyValue("--accent2");
  x.clearRect(0,0,520,260);var sx=40,sy=40,ox=260,oy=130;
  x.strokeStyle=mu;x.lineWidth=1;for(var i=-6;i<=6;i++){x.beginPath();x.moveTo(ox+i*sx,0);x.lineTo(ox+i*sx,260);x.stroke()}for(i=-3;i<=3;i++){x.beginPath();x.moveTo(0,oy+i*sy);x.lineTo(520,oy+i*sy);x.stroke()}
  x.strokeStyle=ink;x.beginPath();x.moveTo(0,oy);x.lineTo(520,oy);x.moveTo(ox,0);x.lineTo(ox,260);x.stroke();
  var disc=4*a*a*a+27*b*b;
  if(disc===0){$("bmsg").innerHTML="<span style='color:var(--bad)'>4a³ + 27b² = 0 here, so the curve has a sharp point. Elliptic curves are not allowed to do that. Move a slider.</span>"}
  else{$("bmsg").textContent="4a³ + 27b² = "+disc+", so this is a real elliptic curve."}
  x.strokeStyle=ac;x.lineWidth=2.5;
  [1,-1].forEach(function(sg){x.beginPath();var st=false;for(var px=-6;px<=6.001;px+=.02){var f=px*px*px+a*px+b;if(f<0){st=false;continue}var py=sg*Math.sqrt(f),X=ox+px*sx,Y=oy-py*sy;if(!st){x.moveTo(X,Y);st=true}else x.lineTo(X,Y)}x.stroke()});
  x.fillStyle=ink;var ints=[];
  for(var X=-6;X<=6;X++){var f2=X*X*X+a*X+b;if(f2<0)continue;var r=Math.round(Math.sqrt(f2));if(r*r===f2){[r,-r].forEach(function(Y,j){if(j===1&&r===0)return;ints.push("("+X+", "+Y+")");x.beginPath();x.arc(ox+X*sx,oy-Y*sy,4,0,6.3);x.fill()})}}
  $("bmsg").innerHTML+="<br>Whole-number points in view: "+(ints.length?ints.join(" "):"none");
  var out=[];[5,7,11,13].forEach(function(p){var n=0;for(var X=0;X<p;X++)for(var Y=0;Y<p;Y++)if(((Y*Y-(X*X*X+a*X+b))%p+p*3)%p===0)n++;out.push("p="+p+": "+n)});
  $("bnp").textContent="Counting on a small clock (x and y from 0 to p−1, remainders only): "+out.join("   ")+"  (these are the N_p style counts Birch and Swinnerton-Dyer studied; the real N_p also counts one extra point at infinity)."}
 $("ba").oninput=draw;$("bb").oninput=draw;draw()}

function lab(id){var c=cv(id),w=WD[id],ms=LAB[id],got=(P.lab[id]||[0,0,0]).slice(),s={dp:{},ids:{}};

 var head=back(w.name)+"<section class='card' style='--wc:"+w.col+"'><div class='lvhead'>Level "+(L+1)+" · "+LV[L].name+"</div><h1>"+w.icon+" "+w.name+"</h1>";

  mcT($("cq"),cq,function(){$("cgo").innerHTML="<div class='btnrow'><button class='btn' id='start'>Your turn: get each one right two times</button></div>";$("start").onclick=run})};
 function run(){queue=slots.map(function(s,i){return i});shuffle(queue);
  app.innerHTML=head+"<div class='stage'><span>YOUR TURN</span>"+slots.length+" kinds of question, each right two times</div><div class='hud'><span id='dots'></span><span>Points <b id='pts'></b> · Streak <b id='cmb'></b></span></div><div class='pbar'><i id='pb'></i></div><div class='q' id='dq'></div></section>";wb();ask()}
 function hud(){$("dots").innerHTML=slots.map(function(s){var k=Math.min(2,s.n);return "<span class='dots'><i class='"+(k>0?"f":"")+"'></i><i class='"+(k>1?"f":"")+"'></i></span>"}).join(" ");
  var t=0;slots.forEach(function(s){t+=Math.min(2,s.n)});$("pb").style.width=Math.round(100*t/(slots.length*2))+"%";$("pts").textContent=fmt(P.pts);$("cmb").textContent=P.combo}
 function ask(){hud();if(!queue.length){finish();return}var i=queue[0],sl=slots[i],q=sl.g?sl.g():fixQ(sl.f);
  var x=renderQ($("dq"),q,function(ok){queue.shift();N++;
   if(ok){C++;sl.n++;if(sl.n<2)queue.splice(Math.min(queue.length,1+Math.floor(Math.random()*2)),0,i)}else{sl.n=0;queue.push(i)}
   answered(id,kind,ok);hud();
   x.res.appendChild(document.createTextNode(ok?(sl.n>=2?" That kind is done: right two times.":" One like this comes again with new numbers."):" One like this comes back later."));
   nextBtn(x.res,queue.length?"Next":"Finish",ask)})}
 function finish(){var acc=N?C/N:0,s=acc>=.9?3:acc>=.75?2:1;if(N&&C===N)award("perfect");setStars(id,L,s);
  go(function(){done({w:id,l:L,s:s,title:LV[L].name+", done",lines:["First-try accuracy: "+Math.round(acc*100)+"% ("+C+" of "+N+" answers).","Every kind of question right two times. That is RE."]})})}
}

function boss(id){var c=cv(id),w=WD[id],slow=false;
 var head=back(w.name)+"<section class='card' style='--wc:"+w.col+"'><div class='lvhead'>Level 5 · Boss round</div><h1>"+w.icon+" "+w.name+" Boss</h1>";
 app.innerHTML=head+"<p>10 questions mixed from everything in "+w.name+". Get <b>7 right</b> to beat the boss and win the <b>"+w.badge+"</b> badge.</p><p>The clock gives you 20 seconds a question. Answer right in 8 seconds for a +5 speed bonus.</p><label class='slow'><input type='checkbox' id='slow'> Take it slow: no clock, no speed bonus</label><div class='btnrow'><button class='btn' id='bgo'>Start the boss round</button></div></section>";
 wireBack(function(){world(id)});
 $("bgo").onclick=function(){slow=$("slow").checked;start()};

  shuffle(c.drill.slice()).slice(0,2).forEach(function(d){list.push(function(){return fixQ(d)})});shuffle(list);
  var i=0,R=0,fast=0;
  app.innerHTML=head+"<div class='hud'><span>Question <b id='bn'>1</b> of 10</span><span>Right <b id='bright'>0</b> · Points <b id='pts'></b></span></div><div class='clock' id='clk'"+(slow?" hidden":"")+"><i id='cl'></i></div><div class='q' id='bq'></div></section>";
  wireBack(function(){world(id)});ask();
  function ask(){if(i>=10){end();return}$("bn").textContent=i+1;$("bright").textContent=R;$("pts").textContent=fmt(P.pts);var q=list[i](),t0=Date.now();
   var x=renderQ($("bq"),q,function(ok){if(TIMER){clearInterval(TIMER);TIMER=null}var el=Date.now()-t0,msg="";i++;answered(id,"boss",ok);
    if(ok){R++;if(!slow&&el<8000){P.pts+=5;P.fast++;fast++;save();msg=" +5 speed bonus!";if(P.fast>=10)award("fast")}}
    $("bright").textContent=R;$("pts").textContent=fmt(P.pts);if(msg)x.res.appendChild(document.createTextNode(msg));nextBtn(x.res,i<10?"Next":"See how you did",ask)});
   if(!slow){var cl=$("cl"),ck=$("clk");cl.style.width="100%";ck.className="clock";
    TIMER=setInterval(function(){var el=Date.now()-t0,p=Math.max(0,1-el/20000);cl.style.width=(p*100)+"%";if(el>15000)ck.className="clock low";if(el>=20000){clearInterval(TIMER);TIMER=null;x.timeout()}},100)}}
  function end(){var s=R===10?3:R>=8?2:R>=7?1:0;

 }

function rate(n,c){if(n<5)return ["Not enough yet",""];var p=100*c/n;return p>=85?["Strong","rate-s"]:p>=60?["Growing","rate-g"]:["Needs practice","rate-n"]}
function report(){var rows="",weak=null,weakP=101,nextUp=null;
 CH.forEach(function(c){var w=WD[c.id],n=0,cc=0,parts=[];
  ["prac","stretch","boss","daily"].forEach(function(k){var s=P.stats[c.id+"."+k];if(s&&s.n){n+=s.n;cc+=s.c;if(LVN[k])parts.push(LVN[k]+" "+Math.round(100*s.c/s.n)+"%")}});
  var r=rate(n,cc);if(n>=5&&100*cc/n<weakP){weakP=100*cc/n;weak=w.name}

  rows+="<tr><td>"+w.icon+" <b>"+w.name+"</b><br><span class='small'>"+(parts.join(" · ")||"No questions yet")+(P.last[c.id]?". Last played "+P.last[c.id]:"")+"</span></td><td>"+worldStars(c.id)+"/15</td><td>"+(n?Math.round(100*cc/n)+"%":"–")+"</td><td class='"+r[1]+"'>"+r[0]+"</td></tr>"});

 "<p class='re'><b>What to do next:</b> "+tip+"</p>"+
 "<table class='rtable'><tr><th>World</th><th>Stars</th><th>First try</th><th>Rating</th></tr>"+rows+"</table>"+
 "<p class='small'>First-try accuracy counts each answer once, right or wrong. A rating shows after 5 answers: Strong is 85% and up, Growing is 60 to 84%, Needs practice is under 60%. Everything is saved only on this device.</p>"+
 (got.length?"<p><b>Badges won:</b> "+got.map(function(b){return b.icon+" "+b.name}).join(", ")+"</p>":"")+
 "<div class='btnrow left'><button id='prt'>Print this report</button></div></section>";

}
